<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Profil Admin - SIDAT</title>

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="./admin-menu.css">
<link rel="stylesheet" href="./profil-admin.css?v=20260919">

</head><body><!-- =====================================================
     HEADER
     ===================================================== -->
<header class="profil-header">

    <div class="header-bubble bubble-1"></div>
    <div class="header-bubble bubble-2"></div>
    <div class="header-bubble bubble-3"></div>

    <button
        type="button"
        id="backButton"
        class="back-button"
        aria-label="Kembali">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
        </svg>
    </button>

    <div class="header-content">
        <h1>PROFIL ADMIN</h1>
        <p>Pengaturan Akun</p>

        <span class="role-badge">
            ADMIN
        </span>
    </div>

</header>


<!-- =====================================================
     MAIN
     ===================================================== -->
<main class="profil-main">

    <!-- Loading -->
    <section id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Memuat profil...</p>
    </section>


    <!-- Konten profil -->
    <div id="profileContent" class="profile-content hidden">

        <!-- =================================================
             FOTO PROFIL
             ================================================= -->
        <section class="profile-card">

            <div class="card-title">
                <div class="card-title-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"></path>
                    </svg>
                </div>

                <div>
                    <h2>Foto Profil</h2>
                    <p>Foto yang digunakan pada akun Admin</p>
                </div>
            </div>


            <div class="profile-photo-area">

                <div class="profile-photo-wrapper">

                    <img
                        id="profileImage"
                        class="profile-photo hidden"
                        alt="Foto Profil Admin">

                    <div
                        id="profilePlaceholder"
                        class="profile-placeholder">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"></path>
                        </svg>

                    </div>

                </div>


                <input
                    type="file"
                    id="photoInput"
                    class="hidden"
                    accept="image/jpeg,image/png,image/webp">


                <button
                    type="button"
                    id="changePhotoButton"
                    class="primary-button">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.1 2.1 0 013 3L8 18l-4 1 1-4Z"></path>
                    </svg>

                    <span>Ganti Foto Profil</span>

                </button>

                <p class="help-text">
                    Format JPG, PNG, atau WebP. Maksimal 2 MB.
                </p>

            </div>

        </section>


        <!-- =================================================
             PASSWORD
             ================================================= -->
        <section class="profile-card">

            <div class="card-title">
                <div class="card-title-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect
                            x="4"
                            y="10"
                            width="16"
                            height="10"
                            rx="2"></rect>
                        <path d="M8 10V7a4 4 0 018 0v3"></path>
                    </svg>
                </div>

                <div>
                    <h2>Password</h2>
                    <p>Ubah password akun Admin</p>
                </div>
            </div>


            <button
                type="button"
                id="changePasswordButton"
                class="secondary-button">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 15a3 3 0 100-6 3 3 0 000 6Z"></path>
                    <path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1-2 2-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5v.1h-2.8v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.9.3l-.1.1-2-2 .1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H6v-2.8h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1 2-2 .1.1a1.7 1.7 0 001.9.3 1.7 1.7 0 001-1.5V4h2.8v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1 2 2-.1.1a1.7 1.7 0 00-.3 1.9 1.7 1.7 0 001.5 1h.1V13h-.1a1.7 1.7 0 00-1.5 2Z"></path>
                </svg>

                <span>Ganti Password</span>

            </button>


            <!-- Form Password -->
            <div
                id="passwordForm"
                class="password-form hidden">

                <div class="form-group">

                    <label for="newPassword">
                        Password Baru
                    </label>

                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            autocomplete="new-password"
                            minlength="6"
                            placeholder="Masukkan password baru">

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword"
                            aria-label="Tampilkan password">

                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>

                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Konfirmasi Password
                    </label>

                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            autocomplete="new-password"
                            minlength="6"
                            placeholder="Ulangi password baru">

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Tampilkan password">

                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>

                        </button>

                    </div>

                </div>


                <div class="password-rules">

                    <div>
                        <span class="rule-icon">✓</span>
                        <span>Minimal 6 karakter</span>
                    </div>

                    <div>
                        <span class="rule-icon">✓</span>
                        <span>Password harus sama</span>
                    </div>

                </div>


                <div class="password-actions">

                    <button
                        type="button"
                        id="cancelPasswordButton"
                        class="cancel-button">
                        Batal
                    </button>

                    <button
                        type="button"
                        id="savePasswordButton"
                        class="primary-button">
                        Simpan Password
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================================
             LOGOUT
             ===================================================== -->
        <section class="profile-card logout-card">

            <div class="logout-content">

                <div class="logout-info">
                    <h2>Keluar dari Akun</h2>
                    <p>Gunakan tombol ini untuk mengakhiri sesi Admin.</p>
                </div>

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button">
                    KELUAR
                </button>

            </div>

        </section>

    </div>

</main>


<!-- =====================================================
     TOAST
     ===================================================== -->
<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite">
</div>


<!-- =====================================================
     ADMIN MENU
     ===================================================== -->
<script type="module">
    import "../js/supabase-config.js";
    import "./admin-menu.js";
</script>

<script type="module" src="./profil-admin.js?v=20260919"></script>

</body>
</html>
