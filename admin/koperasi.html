<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#15803d">

    <title>Koperasi RT - SIDAT</title>

    <link rel="stylesheet" href="koperasi.css">
</head>

<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->
    <header class="koperasi-header">

        <div class="koperasi-header-inner">

            <div class="koperasi-brand">

                <div class="koperasi-brand-icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M4 7h16v13H4z"></path>
                        <path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path>
                        <path d="M4 11h16"></path>
                        <path d="M9 15h6"></path>
                        <path d="M10 19v-4"></path>
                    </svg>
                </div>

                <div class="koperasi-brand-text">
                    <div class="koperasi-brand-name">SIDAT</div>
                    <div class="koperasi-brand-subtitle">Koperasi RT</div>
                </div>

            </div>

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->
    <main class="koperasi-main">

        <!-- Judul halaman -->
        <section class="koperasi-intro">

            <div class="koperasi-intro-icon" aria-hidden="true">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M4 7h16v13H4z"></path>
                    <path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path>
                    <path d="M4 11h16"></path>
                    <path d="M9 15h6"></path>
                    <path d="M10 19v-4"></path>
                </svg>
            </div>

            <div>
                <h1>Koperasi RT</h1>

                <p>
                    Kelola kegiatan koperasi RT melalui SIDAT.
                </p>
            </div>

        </section>


        <!-- =================================================
             AREA MENU KOPERASI
             Untuk sementara masih kosong.
             Menu akan kita tambahkan setelah halaman dasar
             sudah sesuai.
             ================================================= -->
        <section class="koperasi-content">

            <div class="koperasi-empty">

                <div class="koperasi-empty-icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M4 7h16v13H4z"></path>
                        <path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path>
                        <path d="M4 11h16"></path>
                    </svg>
                </div>

                <h2>Modul Koperasi</h2>

                <p>
                    Menu dan fitur koperasi akan ditambahkan pada tahap berikutnya.
                </p>

            </div>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->
    <script src="koperasi.js"></script>

</body>
</html>
