<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#15803d"
    >

    <title>SIDAT - Laporan & Aduan Warga</title>

    <link
        rel="stylesheet"
        href="admin-menu.css"
    >

    <link
        rel="stylesheet"
        href="admin-laporan.css?v=4"
    >
</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="admin-header">

        <div class="header-bubble bubble-1"></div>
        <div class="header-bubble bubble-2"></div>
        <div class="header-bubble bubble-3"></div>
        <div class="header-bubble bubble-4"></div>

        <div class="admin-header-left">

            <button
                type="button"
                class="btn-back"
                onclick="kembaliAdmin()"
                aria-label="Kembali"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M15 5l-7 7 7 7"></path>
                </svg>
            </button>

            <div class="admin-header-title">

                <strong>
                    Laporan & Aduan
                </strong>

                <span>
                    Kelola laporan warga
                </span>

            </div>

        </div>

        <button
            type="button"
            id="refreshButton"
            class="btn-refresh"
            title="Muat ulang"
            aria-label="Muat ulang"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M20 11a8 8 0 0 0-14.9-4"></path>
                <path d="M5 3v4h4"></path>
                <path d="M4 13a8 8 0 0 0 14.9 4"></path>
                <path d="M19 21v-4h-4"></path>
            </svg>
        </button>

    </header>


    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="admin-container">

        <!-- PAGE INTRO -->

        <section class="page-intro">

            <div
                class="page-intro-icon"
                aria-hidden="true"
            >
                <svg
                    viewBox="0 0 24 24"
                >
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9A2.5 2.5 0 0 1 17.5 17H11l-5 4v-4h-.5A2.5 2.5 0 0 1 3 14.5v-9A2.5 2.5 0 0 1 5.5 3"></path>
                    <path d="M7 8h10"></path>
                    <path d="M7 12h6"></path>
                </svg>
            </div>

            <div>

                <h1>
                    Laporan Warga
                </h1>

                <p>
                    Kelola laporan dan aduan dari seluruh warga.
                </p>

            </div>

        </section>


        <!-- ======================================
             STATISTIK
        ======================================= -->

        <section class="report-statistics">

            <div class="stat-card">

                <div
                    class="stat-icon"
                    aria-hidden="true"
                >
                    <svg viewBox="0 0 24 24">
                        <rect
                            x="5"
                            y="3"
                            width="14"
                            height="18"
                            rx="2"
                        ></rect>
                        <path d="M8 7h8"></path>
                        <path d="M8 11h8"></path>
                        <path d="M8 15h5"></path>
                    </svg>
                </div>

                <div class="stat-content">

                    <span>Total</span>

                    <strong id="totalLaporan">
                        0
                    </strong>

                </div>

            </div>


            <div class="stat-card stat-pending">

                <div
                    class="stat-icon"
                    aria-hidden="true"
                >
                    <svg viewBox="0 0 24 24">
                        <circle
                            cx="12"
                            cy="12"
                            r="8.5"
                        ></circle>
                        <path d="M12 7v5l3 2"></path>
                    </svg>
                </div>

                <div class="stat-content">

                    <span>Menunggu</span>

                    <strong id="totalPending">
                        0
                    </strong>

                </div>

            </div>


            <div class="stat-card stat-process">

                <div
                    class="stat-icon"
                    aria-hidden="true"
                >
                    <svg viewBox="0 0 24 24">
                        <path d="M4 12h16"></path>
                        <path d="M13 5l7 7-7 7"></path>
                    </svg>
                </div>

                <div class="stat-content">

                    <span>Diproses</span>

                    <strong id="totalDiproses">
                        0
                    </strong>

                </div>

            </div>


            <div class="stat-card stat-done">

                <div
                    class="stat-icon"
                    aria-hidden="true"
                >
                    <svg viewBox="0 0 24 24">
                        <circle
                            cx="12"
                            cy="12"
                            r="8.5"
                        ></circle>
                        <path d="M8 12l2.5 2.5L16 9"></path>
                    </svg>
                </div>

                <div class="stat-content">

                    <span>Selesai</span>

                    <strong id="totalSelesai">
                        0
                    </strong>

                </div>

            </div>

        </section>


        <!-- ======================================
             FILTER
        ======================================= -->

        <section class="filter-card">

            <div class="search-wrapper">

                <span
                    class="search-icon"
                    aria-hidden="true"
                >
                    <svg viewBox="0 0 24 24">
                        <circle
                            cx="10.8"
                            cy="10.8"
                            r="6.8"
                        ></circle>
                        <path d="M16 16l5 5"></path>
                    </svg>
                </span>

                <input
                    type="search"
                    id="searchLaporan"
                    placeholder="Cari judul, pelapor, atau ID warga..."
                    autocomplete="off"
                >

            </div>


            <div class="filter-row">

                <select id="statusFilter">

                    <option value="">
                        Semua Status
                    </option>

                    <option value="pending">
                        Menunggu
                    </option>

                    <option value="processing">
                        Diproses
                    </option>

                    <option value="completed">
                        Selesai
                    </option>

                </select>


                <select id="categoryFilter">

                    <option value="">
                        Semua Kategori
                    </option>

                </select>

            </div>

        </section>


        <!-- ======================================
             PESAN
        ======================================= -->

        <div
            id="laporanMessage"
            class="laporan-message hidden"
        ></div>


        <!-- ======================================
             LOADING
        ======================================= -->

        <div
            id="laporanLoading"
            class="laporan-loading"
        >

            <div
                class="loading-spinner"
                aria-hidden="true"
            >
                <svg viewBox="0 0 24 24">
                    <circle
                        cx="12"
                        cy="12"
                        r="9"
                    ></circle>
                </svg>
            </div>

            <p>
                Memuat laporan...
            </p>

        </div>


        <!-- ======================================
             LIST
        ======================================= -->

        <section
            id="laporanList"
            class="laporan-list"
        ></section>


        <!-- ======================================
             EMPTY STATE
        ======================================= -->

        <section
            id="laporanEmpty"
            class="laporan-empty hidden"
        >

            <div
                class="empty-icon"
                aria-hidden="true"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M4 7h16v13H4z"></path>
                    <path d="M8 7l1.5-3h5L16 7"></path>
                    <path d="M9 12h6"></path>
                    <path d="M9 16h4"></path>
                </svg>
            </div>

            <h3>
                Belum ada laporan
            </h3>

            <p>
                Tidak ditemukan laporan yang sesuai.
            </p>

        </section>

    </main>


    <!-- ==========================================
         MODAL DETAIL
    =========================================== -->

    <div
        id="detailModal"
        class="modal hidden"
        aria-hidden="true"
    >

        <div
            class="modal-overlay"
            onclick="tutupDetail()"
        ></div>


        <div
            class="modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="detailTitle"
        >

            <div class="modal-header">

                <div>

                    <h2 id="detailTitle">
                        Detail Laporan
                    </h2>

                    <p>
                        Informasi laporan warga
                    </p>

                </div>


                <button
                    type="button"
                    id="closeDetailButton"
                    class="detail-close"
                    aria-label="Tutup"
                >
                    <svg viewBox="0 0 24 24">
                        <path d="M6 6l12 12"></path>
                        <path d="M18 6L6 18"></path>
                    </svg>
                </button>

            </div>


            <div
                id="detailContent"
                class="detail-content"
            ></div>


            <div class="admin-action">

                <div class="form-group">

                    <label for="detailStatus">
                        Status Laporan
                    </label>

                    <select id="detailStatus">

                        <option value="pending">
                            Menunggu
                        </option>

                        <option value="processing">
                            Diproses
                        </option>

                        <option value="completed">
                            Selesai
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="detailAdminNote">
                        Tanggapan Admin
                    </label>

                    <textarea
                        id="detailAdminNote"
                        rows="4"
                        placeholder="Tulis tanggapan untuk warga..."
                    ></textarea>

                </div>


                <div
                    id="detailActionMessage"
                    class="action-message hidden"
                ></div>


                <div class="detail-actions">

                    <button
                        type="button"
                        class="btn-cancel"
                        onclick="tutupDetail()"
                    >
                        Batal
                    </button>


                    <button
                        type="button"
                        id="saveReportButton"
                        class="btn-save"
                        onclick="simpanPerubahanLaporan()"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M5 4h12l2 2v14H5z"></path>
                            <path d="M8 4v6h8V4"></path>
                            <path d="M8 16h8"></path>
                        </svg>
                        Simpan Perubahan
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ==========================================
         SUPABASE
    =========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase-config.js"></script>

    <!-- =====================================================
     MENU ROLE-AWARE
     =====================================================

     ADMIN:
         admin-menu.js

     KETUA RT:
         ketua-rt-menu.js

     Tidak memanggil keduanya sekaligus.
     ===================================================== -->

<script>
(function () {

    "use strict";

    console.log(
        "[SIDAT] Role menu loader dimulai..."
    );


    const ACCESS_TOKEN =
        localStorage.getItem(
            "sidat_access_token"
        );


    if (!ACCESS_TOKEN) {

        console.error(
            "[SIDAT] Access token tidak ditemukan."
        );

        return;
    }


    async function getCurrentUser() {

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    method: "GET",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            ACCESS_TOKEN,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                "Gagal mengambil user aktif: " +
                errorText
            );
        }


        return await response.json();

    }


    async function getUserRole(userId) {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/profiles" +
                "?select=role" +
                "&user_id=eq." +
                encodeURIComponent(userId) +
                "&limit=1",
                {
                    method: "GET",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            ACCESS_TOKEN,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                "Gagal mengambil role profile: " +
                errorText
            );
        }


        const profiles =
            await response.json();


        if (
            !Array.isArray(profiles) ||
            profiles.length === 0
        ) {

            throw new Error(
                "Profile pengguna tidak ditemukan."
            );
        }


        return String(
            profiles[0].role || ""
        )
        .trim()
        .toLowerCase();

    }


    function loadScript(src) {

        return new Promise(
            function (resolve, reject) {

                const script =
                    document.createElement(
                        "script"
                    );


                script.src = src;

                script.dataset.sidatRoleMenu =
                    "true";


                script.onload =
                    function () {

                        console.log(
                            "[SIDAT] Menu berhasil dimuat:",
                            src
                        );

                        resolve();

                    };


                script.onerror =
                    function () {

                        reject(
                            new Error(
                                "Gagal memuat script: " +
                                src
                            )
                        );

                    };


                document.body.appendChild(
                    script
                );

            }
        );

    }


    async function initRoleMenu() {

        try {

            const user =
                await getCurrentUser();


            if (!user?.id) {

                throw new Error(
                    "ID user aktif tidak ditemukan."
                );

            }


            console.log(
                "[SIDAT] User aktif:",
                user.id
            );


            const role =
                await getUserRole(
                    user.id
                );


            console.log(
                "[SIDAT] Role aktif:",
                role
            );


            if (role === "admin") {

                await loadScript(
                    "admin-menu.js"
                );

                return;
            }


            if (role === "ketua_rt") {

                await loadScript(
                    "../ketua-rt/ketua-rt-menu.js"
                );

                return;
            }


            console.warn(
                "[SIDAT] Role",
                role,
                "tidak menggunakan menu Data Warga."
            );

        } catch (error) {

            console.error(
                "[SIDAT] Gagal menentukan menu role:",
                error
            );

        }

    }


    initRoleMenu();

})();
</script>

    <!-- ==========================================
         PAGE JAVASCRIPT
    =========================================== -->

    <script src="admin-laporan.js?v=4"></script>

</body>

</html>
