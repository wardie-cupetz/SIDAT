<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#15803d"
    >

    <title>SIDAT - Pengumuman</title>


    <!-- CSS PENGUMUMAN -->
    <link
        rel="stylesheet"
        href="pengumuman.css"
    >


    <!-- CSS BOTTOM NAVBAR WARGA -->
    <link
        rel="stylesheet"
        href="warga-menu.css"
    >

</head>


<body>

<div class="app">


    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="header">


        <!-- TOMBOL KEMBALI -->

        <button
            type="button"
            class="back-btn"
            onclick="kembaliDashboard()"
            aria-label="Kembali"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path d="M15 18l-6-6 6-6"></path>

            </svg>

        </button>


        <!-- JUDUL HEADER -->

        <div class="header-title">

            <h1>
                Pengumuman
            </h1>

            <span>
                Informasi resmi dari Admin RT
            </span>

        </div>


        <!-- BUBBLE IKON HEADER -->

        <div
            class="header-icon"
            aria-hidden="true"
        >

            <svg
                viewBox="0 0 24 24"
            >

                <path d="M3 10v4h4l5 4V6l-5 4H3Z"></path>

                <path d="M16 9.5a4 4 0 0 1 0 5"></path>

                <path d="M18.5 7a7.5 7.5 0 0 1 0 10"></path>

            </svg>

        </div>


    </header>



    <!-- ======================================
         CONTENT
    ======================================= -->

    <main class="content">


        <!-- ==================================
             PAGE TITLE
        =================================== -->

        <section class="page-title">


            <div
                class="page-icon"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 24 24"
                >

                    <path d="M3 10v4h4l5 4V6l-5 4H3Z"></path>

                    <path d="M16 9.5a4 4 0 0 1 0 5"></path>

                    <path d="M18.5 7a7.5 7.5 0 0 1 0 10"></path>

                </svg>

            </div>


            <div class="page-title-content">

                <h2>
                    Pengumuman RT
                </h2>

                <p>
                    Informasi terbaru dan resmi
                    dari pengurus RT.
                </p>

            </div>


        </section>



        <!-- ==================================
             LOADING
        =================================== -->

        <div
            id="loading"
            class="loading"
        >

            <div class="loading-spinner"></div>

            <span>
                Memuat pengumuman...
            </span>

        </div>



        <!-- ==================================
             DAFTAR PENGUMUMAN
        =================================== -->

        <section
            id="announcementList"
            class="announcement-list"
            aria-live="polite"
        >
        </section>



        <!-- ==================================
             EMPTY STATE
        =================================== -->

        <div
            id="emptyState"
            class="empty-state hidden"
        >

            <div
                class="empty-icon"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 24 24"
                >

                    <path d="M3 10v4h4l5 4V6l-5 4H3Z"></path>

                    <path d="M16 9.5a4 4 0 0 1 0 5"></path>

                </svg>

            </div>


            <strong>
                Belum ada pengumuman
            </strong>


            <span>
                Belum ada pengumuman terbaru
                dari Admin RT.
            </span>


        </div>



        <!-- ==================================
             ERROR STATE
        =================================== -->

        <div
            id="errorState"
            class="empty-state error-state hidden"
        >


            <div
                class="empty-icon error-icon"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 24 24"
                >

                    <path d="M10.3 3.6 2.4 17a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"></path>

                    <path d="M12 9v4"></path>

                    <path d="M12 17h.01"></path>

                </svg>

            </div>


            <strong>
                Gagal memuat pengumuman
            </strong>


            <span id="errorMessage">
                Silakan coba lagi beberapa saat.
            </span>


            <button
                type="button"
                class="retry-button"
                onclick="tampilkanPengumuman()"
            >
                Coba Lagi
            </button>


        </div>


    </main>


</div>



<!-- ==========================================
     SUPABASE
=========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="../js/supabase-config.js"
></script>



<!-- ==========================================
     MENU WARGA
=========================================== -->

<script
    src="./warga-menu.js"
></script>



<!-- ==========================================
     PENGUMUMAN
=========================================== -->

<script
    src="./pengumuman.js"
></script>


</body>

</html>
