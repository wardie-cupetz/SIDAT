<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    ><title>SIDAT - Laporan & Aduan</title>

<link rel="stylesheet" href="laporan.css">
<link rel="stylesheet" href="warga-menu.css">

</head><body><header class="top-header">
    <div class="header-bubble header-bubble-one"></div>
    <div class="header-bubble header-bubble-two"></div>

    <button
        type="button"
        class="header-back-button"
        onclick="kembaliDashboard()"
        aria-label="Kembali"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
        </svg>
    </button>

    <div class="header-content">
        <div class="header-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5h16v11H4z"></path>
                <path d="M8 20h8"></path>
                <path d="M9 9h6"></path>
                <path d="M9 12h4"></path>
            </svg>
        </div>

        <div>
            <h1>Laporan & Aduan</h1>
            <p>Sampaikan laporan atau aduan kepada pengurus RT</p>
        </div>
    </div>
</header>


<main class="laporan-container">

    <!-- FORM LAPORAN -->
    <section class="laporan-card">

        <div class="section-heading">
            <div class="section-heading-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"></path>
                </svg>
            </div>

            <div>
                <h2>Buat Laporan</h2>
                <p>Sampaikan kondisi atau masalah di lingkungan RT</p>
            </div>
        </div>


        <form id="laporanForm" novalidate>

            <div class="form-group">
                <label for="category">Kategori</label>

                <select id="category" name="category" required>
                    <option value="">Pilih kategori</option>
                    <option value="Fasilitas RT">Fasilitas RT</option>
                    <option value="Keamanan">Keamanan</option>
                    <option value="Kebersihan">Kebersihan</option>
                    <option value="Jalan & Lingkungan">Jalan & Lingkungan</option>
                    <option value="Jimpitan">Jimpitan</option>
                    <option value="Administrasi">Administrasi</option>
                    <option value="Kegiatan RT">Kegiatan RT</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>


            <div class="form-group">
                <label for="title">Judul Laporan</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    maxlength="150"
                    placeholder="Contoh: Lampu jalan mati"
                    autocomplete="off"
                    required
                >

                <div class="field-counter">
                    <span id="titleCounter">0/150</span>
                </div>
            </div>


            <div class="form-group">
                <label for="description">Keterangan</label>

                <textarea
                    id="description"
                    name="description"
                    maxlength="1000"
                    rows="6"
                    placeholder="Jelaskan kondisi atau masalah secara lengkap..."
                    required
                ></textarea>

                <div class="field-counter">
                    <span id="descriptionCounter">0/1000</span>
                </div>
            </div>


            <div class="form-group">

                <label>Foto Pendukung</label>

                <label
                    for="photoInput"
                    class="photo-upload-button"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 5h16v14H4z"></path>
                        <circle cx="9" cy="10" r="1.5"></circle>
                        <path d="M4 16l4-4 3 3 3-3 6 6"></path>
                    </svg>

                    <span>Tambah Foto</span>
                </label>

                <input
                    type="file"
                    id="photoInput"
                    accept="image/jpeg,image/png,image/webp"
                    hidden
                >


                <div
                    id="photoPreviewContainer"
                    class="photo-preview-container"
                    hidden
                >

                    <div class="photo-preview-wrapper">

                        <img
                            id="photoPreview"
                            src=""
                            alt="Pratinjau foto laporan"
                        >

                        <button
                            type="button"
                            id="removePhotoButton"
                            class="remove-photo-button"
                            aria-label="Hapus foto"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6 6l12 12"></path>
                                <path d="M18 6L6 18"></path>
                            </svg>
                        </button>

                    </div>

                    <div id="photoInfo" class="photo-info"></div>

                </div>


                <p class="photo-help">
                    Maksimal 2 MB. Format JPG, PNG, atau WEBP.
                </p>

            </div>


            <div
                id="formError"
                class="form-message form-error"
                hidden
            ></div>


            <div
                id="formSuccess"
                class="form-message form-success"
                hidden
            ></div>


            <button
                type="submit"
                id="submitButton"
                class="submit-button"
            >
                <svg
                    class="submit-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M22 2L11 13"></path>
                    <path d="M22 2l-7 20-4-9-9-4z"></path>
                </svg>

                <span id="submitButtonText">
                    Kirim Laporan
                </span>
            </button>

        </form>

    </section>


    <!-- RIWAYAT LAPORAN -->
    <section class="laporan-card riwayat-card">

        <div class="section-heading">

            <div class="section-heading-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 5h16v15H4z"></path>
                    <path d="M8 3v4"></path>
                    <path d="M16 3v4"></path>
                    <path d="M4 9h16"></path>
                    <path d="M8 13h3"></path>
                    <path d="M8 16h6"></path>
                </svg>
            </div>

            <div>
                <h2>Riwayat Laporan</h2>
                <p>Lihat laporan warga yang sudah dikirim</p>
            </div>

        </div>


        <div class="filter-search">

            <div class="search-box">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20l-4-4"></path>
                </svg>

                <input
                    type="search"
                    id="searchLaporan"
                    placeholder="Cari laporan..."
                    autocomplete="off"
                >

            </div>

        </div>


        <div class="filter-row">

            <div class="filter-item">
                <label for="filterKategori">
                    Kategori
                </label>

                <select id="filterKategori">
                    <option value="">
                        Semua kategori
                    </option>

                    <option value="Fasilitas RT">
                        Fasilitas RT
                    </option>

                    <option value="Keamanan">
                        Keamanan
                    </option>

                    <option value="Kebersihan">
                        Kebersihan
                    </option>

                    <option value="Jalan & Lingkungan">
                        Jalan & Lingkungan
                    </option>

                    <option value="Jimpitan">
                        Jimpitan
                    </option>

                    <option value="Administrasi">
                        Administrasi
                    </option>

                    <option value="Kegiatan RT">
                        Kegiatan RT
                    </option>

                    <option value="Lainnya">
                        Lainnya
                    </option>
                </select>
            </div>


            <div class="filter-item">
                <label for="filterStatus">
                    Status
                </label>

                <select id="filterStatus">

                    <option value="">
                        Semua status
                    </option>

                    <option value="pending">
                        Menunggu
                    </option>

                    <option value="process">
                        Diproses
                    </option>

                    <option value="resolved">
                        Selesai
                    </option>

                    <option value="rejected">
                        Ditolak
                    </option>

                </select>
            </div>

        </div>


        <div
            id="laporanList"
            class="laporan-list"
        >

            <div class="loading-state">

                <div class="loading-spinner"></div>

                <p>Memuat laporan...</p>

            </div>

        </div>

    </section>

</main>


<!-- DETAIL MODAL -->
<div
    id="detailModal"
    class="detail-modal"
    hidden
>

    <div
        class="detail-modal-overlay"
        onclick="tutupDetail()"
    ></div>


    <div
        class="detail-modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detailModalTitle"
    >

        <div class="detail-modal-header">

            <div>

                <span class="detail-modal-label">
                    Detail Laporan
                </span>

                <h2 id="detailModalTitle">
                    Laporan
                </h2>

            </div>


            <button
                type="button"
                id="btnCloseDetail"
                class="detail-close-button"
                aria-label="Tutup"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12"></path>
                    <path d="M18 6L6 18"></path>
                </svg>
            </button>

        </div>


        <div
            id="detailContent"
            class="detail-content"
        ></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="./warga-menu.js"></script>
<script src="./laporan.js"></script>

</body>
</html>
