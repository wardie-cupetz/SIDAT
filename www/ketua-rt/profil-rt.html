<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#15803d"
    >

    <title>SIDAT - Profil RT</title>


    <!-- ==========================================
     SIDAT GLOBAL
=========================================== -->

<link
    rel="stylesheet"
    href="../style.css"
>


<!-- ==========================================
     MENU KETUA RT
=========================================== -->

<link
    rel="stylesheet"
    href="../admin/admin-menu.css"
>


<!-- ==========================================
     PROFIL RT
=========================================== -->

<link
    rel="stylesheet"
    href="profil-rt.css"
>

</head>


<body>


    <!-- =================================================
         HEADER PROFIL RT
    ================================================== -->

    <header class="profil-header">


        <!-- KEMBALI -->

        <button
            type="button"
            class="back-button"
            id="btnBack"
            aria-label="Kembali ke Dashboard"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M15 18l-6-6 6-6"
                />

            </svg>

        </button>


        <!-- JUDUL -->

        <div class="header-title">

            <div class="header-title-main">
                PROFIL RT
            </div>

            <div class="header-title-sub">
                Pengaturan Akun
            </div>

        </div>


        <!-- ROLE -->

        <div class="header-role">
            KETUA RT
        </div>


    </header>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="profil-container">


        <!-- ==========================================
             LOADING
        =========================================== -->

        <div
            id="loadingProfil"
            class="loading-profil"
        >

            <div class="loading-spinner"></div>

            <p>
                Memuat profil...
            </p>

        </div>



        <!-- ==========================================
             CONTENT
        =========================================== -->

        <div
            id="profilContent"
            class="profil-content hidden"
        >


            <!-- =================================================
                 FOTO PROFIL
            ================================================== -->

            <section class="profil-card">


                <div class="card-title">

                    <span class="card-title-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <circle
                                cx="12"
                                cy="8"
                                r="3.5"
                            />

                            <path
                                d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"
                            />

                        </svg>

                    </span>


                    <span>
                        Foto Profil
                    </span>

                </div>



                <div class="photo-section">


                    <div class="profile-photo-wrapper">


                        <img
                            id="profilePhoto"
                            class="profile-photo"
                            alt="Foto Profil KETUA RT"
                        >


                        <div
                            id="photoLoading"
                            class="photo-loading hidden"
                        >

                            <div
                                class="loading-spinner small"
                            ></div>

                        </div>


                    </div>



                    <div class="photo-info">

                        <div
                            id="profileName"
                            class="profile-name"
                        >
                            Ketua RT
                        </div>

                        <div class="profile-role">
                            KETUA RT
                        </div>

                    </div>


                </div>



                <!-- FILE INPUT -->

                <input
                    type="file"
                    id="photoInput"
                    accept="image/jpeg,image/png,image/webp"
                    hidden
                >



                <!-- GANTI FOTO -->

                <button
                    type="button"
                    id="btnChangePhoto"
                    class="primary-button button-with-icon"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"
                        />

                        <circle
                            cx="12"
                            cy="13"
                            r="3.5"
                        />

                    </svg>


                    <span>
                        Ganti Foto Profil
                    </span>

                </button>



                <p class="form-help">
                    Format JPG, PNG, atau WEBP. Maksimal 2 MB.
                </p>


            </section>



            <!-- =================================================
                 PASSWORD
            ================================================== -->

            <section class="profil-card">


                <div class="card-title">

                    <span class="card-title-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="10"
                                rx="2"
                            />

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            />

                            <circle
                                cx="12"
                                cy="15"
                                r="1"
                            />

                        </svg>

                    </span>


                    <span>
                        Password
                    </span>

                </div>



                <p class="section-description">

                    Ubah password akun KETUA RT Anda.

                </p>



                <button
                    type="button"
                    id="btnChangePassword"
                    class="secondary-button button-with-icon"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="4"
                            y="10"
                            width="16"
                            height="10"
                            rx="2"
                        />

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        />

                    </svg>


                    <span>
                        Ganti Password
                    </span>

                </button>


            </section>



            <!-- =================================================
                 FORM PASSWORD
            ================================================== -->

            <section
                id="passwordFormCard"
                class="profil-card password-form-card hidden"
            >


                <div class="card-title">

                    <span class="card-title-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M7 10V7a5 5 0 0 1 10 0v3"
                            />

                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="10"
                                rx="2"
                            />

                            <circle
                                cx="12"
                                cy="15"
                                r="1"
                            />

                        </svg>

                    </span>


                    <span>
                        Password Baru
                    </span>

                </div>



                <!-- PASSWORD BARU -->

                <div class="form-group">


                    <label for="newPassword">
                        Password Baru
                    </label>


                    <div class="password-input-wrapper">


                        <input
                            type="password"
                            id="newPassword"
                            autocomplete="new-password"
                            placeholder="Masukkan password baru"
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword"
                            aria-label="Tampilkan password"
                        >

                            <svg
                                class="icon-eye"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                />

                            </svg>

                        </button>


                    </div>

                </div>



                <!-- KONFIRMASI PASSWORD -->

                <div class="form-group">


                    <label for="confirmPassword">
                        Konfirmasi Password
                    </label>


                    <div class="password-input-wrapper">


                        <input
                            type="password"
                            id="confirmPassword"
                            autocomplete="new-password"
                            placeholder="Ulangi password baru"
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Tampilkan password"
                        >

                            <svg
                                class="icon-eye"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                />

                            </svg>

                        </button>


                    </div>

                </div>



                <!-- VALIDASI -->

                <div class="password-rules">


                    <div id="ruleLength">

                        <span class="rule-icon">○</span>

                        Minimal 6 karakter

                    </div>


                    <div id="ruleMatch">

                        <span class="rule-icon">○</span>

                        Password harus sama

                    </div>


                </div>



                <!-- AKSI -->

                <div class="password-actions">


                    <button
                        type="button"
                        id="btnCancelPassword"
                        class="cancel-button"
                    >
                        Batal
                    </button>


                    <button
                        type="button"
                        id="btnSavePassword"
                        class="primary-button"
                    >
                        Simpan Password
                    </button>


                </div>


            </section>


        </div>


    </main>



    <!-- =================================================
         TOAST
    ================================================== -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>



    <!-- =================================================
         SUPABASE
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase-config.js"></script>
  <script>
    window.supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    console.log(
        "[SIDAT] Supabase client berhasil dibuat."
    );
  </script>



    <!-- =================================================
         ROLE-AWARE MENU
    ================================================== -->

    <script>

        (async function loadRoleMenu() {

            try {

                const token =
                    localStorage.getItem(
                        "sidat_access_token"
                    );


                if (!token) {

                    console.warn(
                        "SIDAT: access token tidak ditemukan."
                    );

                    return;

                }


                const userResponse =
                    await fetch(
                        `${SUPABASE_URL}/auth/v1/user`,
                        {
                            method: "GET",

                            headers: {

                                apikey:
                                    SUPABASE_KEY,

                                Authorization:
                                    `Bearer ${token}`

                            }

                        }
                    );


                if (!userResponse.ok) {

                    console.warn(
                        "SIDAT: gagal mengambil user."
                    );

                    return;

                }


                const user =
                    await userResponse.json();


                if (!user?.id) {

                    return;

                }


                const profileResponse =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/profiles?select=role&user_id=eq.${encodeURIComponent(user.id)}&limit=1`,
                        {
                            method: "GET",

                            headers: {

                                apikey:
                                    SUPABASE_KEY,

                                Authorization:
                                    `Bearer ${token}`

                            }

                        }
                    );


                if (!profileResponse.ok) {

                    console.warn(
                        "SIDAT: gagal mengambil role."
                    );

                    return;

                }


                const profiles =
                    await profileResponse.json();


                const role =
                    profiles?.[0]?.role;


                console.log(
                    "SIDAT: role halaman profil:",
                    role
                );


                if (role === "admin") {

                    const script =
                        document.createElement(
                            "script"
                        );


                    script.src =
                        "../admin/admin-menu.js";


                    document.body.appendChild(
                        script
                    );


                } else if (
                    role === "ketua_rt"
                ) {

                    const script =
                        document.createElement(
                            "script"
                        );


                    script.src =
                        "ketua-rt-menu.js";


                    document.body.appendChild(
                        script
                    );


                } else {

                    console.warn(
                        "SIDAT: role tidak memiliki menu halaman ini:",
                        role
                    );

                }


            } catch (error) {

                console.error(
                    "SIDAT: error role menu:",
                    error
                );

            }

        })();

    </script>



    <!-- =================================================
         PROFIL RT
    ================================================== -->

    <script src="profil-rt.js"></script>


</body>
</html>
