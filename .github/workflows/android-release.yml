name: Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan di:"
            echo "$SDKMANAGER"
            echo
            echo "Isi folder cmdline-tools:"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # =========================================================
      # CAPACITOR
      # =========================================================

      - name: Sync Capacitor
        run: npx cap sync android

      # =========================================================
      # RELEASE KEYSTORE
      # =========================================================

      - name: Prepare release keystore
        env:
          SIDAT_KEYSTORE_BASE64: ${{ secrets.SIDAT_KEYSTORE_BASE64 }}
          SIDAT_KEYSTORE_PASSWORD: ${{ secrets.SIDAT_KEYSTORE_PASSWORD }}
          SIDAT_KEY_ALIAS: ${{ secrets.SIDAT_KEY_ALIAS }}
          SIDAT_KEY_PASSWORD: ${{ secrets.SIDAT_KEY_PASSWORD }}
        run: |
          echo "$SIDAT_KEYSTORE_BASE64" | base64 --decode > /tmp/sidat-release.jks

          cat > android/key.properties <<EOF2
          storeFile=/tmp/sidat-release.jks
          storeType=PKCS12
          storePassword=$SIDAT_KEYSTORE_PASSWORD
          keyAlias=$SIDAT_KEY_ALIAS
          keyPassword=$SIDAT_KEY_PASSWORD
          EOF2

          keytool -list \
            -keystore /tmp/sidat-release.jks \
            -storetype PKCS12 \
            -alias "$SIDAT_KEY_ALIAS" \
            -storepass "$SIDAT_KEYSTORE_PASSWORD"

      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # =========================================================
      # PREPARE APK
      # =========================================================

      - name: Prepare APK files
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | sed 's/.*versionName "\([^"]*\)".*/\1/')

          cp android/app/build/outputs/apk/release/app-release.apk SIDAT.apk

          cp android/app/build/outputs/apk/release/app-release.apk \
            "SIDAT-v${VERSION_NAME}.apk"

      # =========================================================
      # GITHUB RELEASE
      # =========================================================

            - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | sed 's/.*versionName "\([^"]*\)".*/\1/')
          TAG="v${VERSION_NAME}"

          echo "Release tag: $TAG"

          # Hapus release lama jika sudah ada.
          gh release delete "$TAG" \
            --yes \
            --cleanup-tag \
            || true

          # Buat release baru dengan APK terbaru.
          gh release create "$TAG" \
            SIDAT.apk \
            "SIDAT-v${VERSION_NAME}.apk" \
            --title "SIDAT v${VERSION_NAME}" \
            --generate-notes
